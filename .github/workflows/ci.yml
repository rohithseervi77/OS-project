name: Build, Test & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js LTS
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client & Sync Database
      run: |
        npx prisma generate
        npx prisma db push

    - name: Run Master Unit Test Suite (24 Tests)
      run: npm test

    - name: Build Next.js Production Application
      run: npm run build
